            description: is Operationalized By Capability (goal is Operationalized By Capability). Ids of the dCapability elements; multiplicity 0..*.
          dGoalTargetsdMeasurementIndicator:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dMeasurementIndicator'
            description: Targets KPI (Goal Targets KPI). Ids of the dMeasurementIndicator elements; multiplicity 0..*.
          dRequirementIsRelatedToGoal_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dRequirement'
            description: is specified by Requirement (req related to Goal). Ids of the dRequirement elements; multiplicity 0..*.
    dGrowthPackage:
      description: A set of actions identified to achieve one or more objectives for the business. A work package can be a part of an Initiative, a complete project, or a part of a Program. A Growth pack
        is a collection of Initiatives architected for consistency and aimed to be executed in the same period.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          dPackageIsDeliveredByInitiative:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dInitiative'
            description: is delivered by Initiative (Package is delivered by Initiative). Ids of the dInitiative elements; multiplicity 0..*.
          dProgramIsOrganizedInPackages_inverse:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dProgram'
            description: part of a Program (Program is organized In Packages). Ids of the dProgram elements; multiplicity 1.
        required:
        - dProgramIsOrganizedInPackages_inverse
    dIPRange:
      description: Defines a range of IP addresses (CIDR) used within a network. This aligns with ArchiMate's concept of Infrastructure Service, providing connectivity.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          CIDR:
            type: string
            description: 'The address range in CIDR notation: an IP address, a slash and the number of network bits, e.g. 192.168.0.0/24 for 256 addresses.'
          ipRangeType:
            allOf:
            - $ref: '#/components/schemas/ipRangeType'
            description: 'What the range is used for: Pod (container pods), Service (cluster services) or subNetwork.'
            nullable: true
          Public:
            allOf:
            - $ref: '#/components/schemas/dboolean'
            description: true when the addresses in the range are reachable from the internet; otherwise false.
            nullable: true
          dSubNetworkAggregatesIPRange_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dSubNetwork'
            description: is Aggregated in sub Net. (SubNetwork Aggregates IP Range). Ids of the dSubNetwork elements; multiplicity 0..*.
        required:
        - CIDR
    dInitiative:
      description: An activity carried out by a Business Unit or organization to achieve a particular goal or improve the Maturity of a certain capability.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          ability to Implement:
            type: integer
            description: How confident you are that the organisation can deliver the initiative, as a percentage from 1 to 100.
            nullable: true
          actualFinishDate:
            type: string
            format: date
            description: The date the initiative actually finished; not before actualStartDate. Absent means not finished.
            nullable: true
          actualStartDate:
            type: string
            format: date
            description: The date work actually started. Absent means not started.
            nullable: true
          Description:
            type: string
            description: A one- or two-sentence summary of the initiative, e.g. "Replace PolicyMaster with NovaPAS".
            nullable: true
          DetailedDescription:
            type: string
            description: 'The full description of the initiative: scope, approach, deliverables and what is out of scope.'
            nullable: true
          EstimatedTotalCost:
            allOf:
            - $ref: '#/components/schemas/dQuantityValue'
            description: The current estimate of the total cost, with an ISO 4217 currency as unit. When the initiative also has cost periods (dInitiativeHasCostPeriod), their amounts should add up to it.
            nullable: true
          finishDate:
            type: string
            format: date
            description: The planned finish date. Record the real one in actualFinishDate.
          Impacted Capability:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dCapability'
            description: 'Deprecated: duplicates the relationship dInitiativeIncreasesMaturityOf. Link the initiative to the capabilities it improves with that relationship instead.'
          InitiativeDuration:
            type: string
            format: duration
            description: The planned duration, as an xsd:duration, e.g. P18M. When startDate and finishDate are both set, it must equal the time between them.
            nullable: true
          initiativeHealth:
            allOf:
            - $ref: '#/components/schemas/InitiativeStatus'
            description: The health of the initiative as a traffic light, from DeepGreen (on track) to Red (in serious trouble).
            nullable: true
          kind:
            type: string
            description: The type of initiative, following your own taxonomy, e.g. "Transformation", "Compliance", "Run".
            nullable: true
          purpose:
            type: string
            description: 'Why the initiative exists: the problem it solves or the outcome it delivers, in one sentence.'
            nullable: true
          Rank:
            type: string
            description: The position of the initiative in the portfolio ranking, e.g. 1 for the most important.
            nullable: true
          RelatedProgram:
            type: string
            description: 'Deprecated: free text, not a link. Put the initiative in a dGrowthPackage that belongs to a dProgram instead.'
            nullable: true
          startDate:
            type: string
            format: date
            description: The planned start date. Record the real one in actualStartDate.
          dInitiativeChangesLogicalComponent:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dLogicalAppComponent'
            description: changes Logical Component (Initiative Changes Logical Component). Ids of the dLogicalAppComponent elements; multiplicity 0..*.
          dInitiativeChangesProcess:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dBusinessProcess'
            description: changes Process (Initiative Changes Process). Ids of the dBusinessProcess elements; multiplicity 0..*.
          dInitiativeDeploysApplication:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dApplicationComponent'
            description: deploys Application (Initiative Deploys Application). Ids of the dApplicationComponent elements; multiplicity 0..*.
          dInitiativeHasCostPeriod:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dCostPeriod'
            description: has Cost Period (Initiative Has Cost Period). Ids of the dCostPeriod elements; multiplicity 0..*. The initiative's spend in one period, planned (kind Estimate) or actual (kind Actual).
              The cost periods of one initiative do not overlap.
          dInitiativeIncreasesMaturityOf:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dCapability'
            description: Increases Maturity Of Capability (Initiative Increases Maturity Of Capability). Ids of the dCapability elements; multiplicity 0..*.
          dInitiativeisMakingUseOfDecision_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dDecision'
            description: Makes Use Of Decision (Initiative is Making Use Of Decision). Ids of the dDecision elements; multiplicity 0..*.
          dInitiativeRetiresApplication:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dApplicationComponent'
            description: retires Application (Initiative Retires Application). Ids of the dApplicationComponent elements; multiplicity 0..*.
          dPackageIsDeliveredByInitiative_inverse:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dGrowthPackage'
            description: is part of a Package (Package is delivered by Initiative). Ids of the dGrowthPackage elements; multiplicity 1.
        required:
        - finishDate
        - startDate
        - dPackageIsDeliveredByInitiative_inverse
    dIssue:
      description: Am issue is a  concrete problem that is affecting a business. Also, a fact that sets a Requirement to be false. (see also Risk)
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          Author:
            type: string
            description: 'Who raised the issue: name and role in the project.'
            nullable: true
          Responsible:
            type: string
            description: 'Who is responsible for closing the issue: name and role. Use none until it is assigned.'
            nullable: true
          dIssueStopsRealizationOfRequirement:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dRequirement'
            description: stop Requirement (Issue Stops Realization Of Req). Ids of the dRequirement elements; multiplicity 0..*.
          dRiskRealizedByIssue:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dRisk'
            description: is realizing Risk (realized by Issue). Ids of the dRisk elements; multiplicity 0..1.
            nullable: true
    dJSON_Attribute:
      description: Defines attributes in JSON data structures.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          jSONtype:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dJSON_Type'
            description: The JSON type of the attribute, as a dJSON_Type that defines its type and constraints.
        required:
        - jSONtype
    dJSON_Datatype:
      description: Represents a data type used within JSON structures, defining the format and constraints of data elements in a schema. JSON Data Types include standard types such as string, number, object,
        array, boolean, and null, ensuring consistency and validation in data exchange between systems.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties: {}
    dJSON_Element:
      description: Represents elements or nodes in JSON schemas.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          dJSONElement_associates_JSONElement:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dJSON_Element'
            description: target JsonElement (dJSONElement_associates_JSONElement). Ids of the dJSON_Element elements; multiplicity 0..*.
          dJSONElement_associates_JSONElement_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dJSON_Element'
            description: Source JsonElement (dJSONElement_associates_JSONElement). Ids of the dJSON_Element elements; multiplicity 0..*.
          dSchemaAssociatesElement_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dJSON_Schema'
            description: Associates Schema (Schema Associates Element). Ids of the dJSON_Schema elements; multiplicity 0..*.
    dJSON_Schema:
      description: The Schema Object allows the definition of input and output data types. These types can be objects, but also primitives and arrays. This object is based on the JSON Schema Specification
        Draft 4 and uses a predefined subset of it. On top of this subset, there are extensions provided by this specification to allow for more complete documentation
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          schema:
            allOf:
            - $ref: '#/components/schemas/SchemaVersion'
            description: The JSON Schema draft the schema follows, as its $schema URI, e.g. http://json-schema.org/draft-07/schema#.
          schemaFileName:
            type: string
            description: The name of the file the schema is generated to, e.g. claim.schema.json. Absent means the generator chooses it.
            nullable: true
          dAPIAggregatesSchema_inverse:
            type: array
            items:
              type: string
