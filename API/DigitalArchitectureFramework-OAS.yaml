              x-reference: '#/components/schemas/dAPI'
            description: is aggregates in API (Aggregates Schema). Ids of the dAPI elements; multiplicity 0..*.
          dJSON_SchemaSubSetGeneralizes_JSON_Schema:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dJSON_SchemaSubSet'
            description: Parent Schema (Schema Generalizes Schema). Ids of the dJSON_SchemaSubSet elements; multiplicity 0..*.
          dJSONSchemaRealizesModel:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dModelClass'
            description: realizes Model Class (Schema Realizes Model). Ids of the dModelClass elements; multiplicity 1.
          dPolymorphicCollection:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dJSON_Schema'
            description: '@baseType (Polymorphic Collection). Ids of the dJSON_Schema elements; multiplicity 0..*.'
          dPolymorphicCollection_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dJSON_Schema'
            description: '@Type (Polymorphic Collection). Ids of the dJSON_Schema elements; multiplicity 0..*.'
          dSchema_Associates_Schema:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dJSON_Schema'
            description: Target Schema (Schema Association). Ids of the dJSON_Schema elements; multiplicity 0..*.
          dSchema_Associates_Schema_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dJSON_Schema'
            description: Source Schema (Schema Association). Ids of the dJSON_Schema elements; multiplicity 0..*.
          dSchemaAssociatesElement:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dJSON_Element'
            description: Associates Element (Schema Associates Element). Ids of the dJSON_Element elements; multiplicity 0..*.
          dSchemaGeneralizesSchema:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dJSON_Schema'
            description: Child Schema (Schema Generalization). Ids of the dJSON_Schema elements; multiplicity 0..*.
          dSchemaGeneralizesSchema_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dJSON_Schema'
            description: Parent Schema (Schema Generalization). Ids of the dJSON_Schema elements; multiplicity 0..*.
        required:
        - schema
        - dJSONSchemaRealizesModel
    dJSON_SchemaSubSet:
      description: Represents subsets of JSON schema structures.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          default:
            type: string
            description: The value to assume when none is given.
            nullable: true
          enum:
            type: string
            description: The allowed values, comma-separated, e.g. open, closed, rejected.
            nullable: true
          exclusivemaximum:
            type: boolean
            description: true when the value must be strictly less than maximum; otherwise it may equal it.
            nullable: true
          exclusiveminimum:
            type: boolean
            description: true when the value must be strictly greater than minimum; otherwise it may equal it.
            nullable: true
          format:
            allOf:
            - $ref: '#/components/schemas/format'
            description: The format a string value must have, e.g. date, email, uri.
            nullable: true
          maximum:
            type: number
            description: The largest value a number may have.
            nullable: true
          maxItems:
            type: integer
            description: The maximum number of items in an array.
            nullable: true
          maxlength:
            type: integer
            description: The maximum number of characters of a string value.
            nullable: true
          maxProperties:
            type: integer
            description: The maximum number of properties an object may have.
            nullable: true
          minimum:
            type: number
            description: The smallest value a number may have.
            nullable: true
          minItems:
            type: integer
            description: The minimum number of items in an array.
            nullable: true
          minlength:
            type: integer
            description: The minimum number of characters of a string value.
            nullable: true
          minProperties:
            type: integer
            description: The minimum number of properties an object must have.
            nullable: true
          multipleof:
            type: number
            description: A number the value must be a multiple of, e.g. 0.01 for amounts in cents.
            nullable: true
          pattern:
            type: string
            description: A regular expression a string value must match, e.g. ^[A-Z]{3}-[0-9]{4}$.
            nullable: true
          required:
            type: string
            description: The names of the properties an object must have, comma-separated.
            nullable: true
          uniqueItems:
            type: boolean
            description: true when all items of an array must be different; otherwise false.
            nullable: true
          dJSON_SchemaSubSetGeneralizes_JSON_Schema_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dJSON_Schema'
            description: Child Schema (Schema Generalizes Schema). Ids of the dJSON_Schema elements; multiplicity 0..*.
    dJSON_Type:
