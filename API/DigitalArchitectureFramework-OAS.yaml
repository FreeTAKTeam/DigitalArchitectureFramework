    dMeasurementIndicator:
      description: The specific measure captured for a Organization or Business Unit which can be measured and quantifiable.  A measurement is a Key Performance indicator
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          CurrentLevel:
            allOf:
            - $ref: '#/components/schemas/dQuantityValue'
            description: The last measured value of the KPI, in UnitOfMeasure, with asOf set to the measurement date.
            nullable: true
          Definition:
            type: string
            description: How the KPI is calculated and what it means, e.g. "(claims incurred + expenses) / net earned premium".
            nullable: true
          LastStandardReviewDate:
            type: string
            format: date-time
            description: When the KPI's definition was last reviewed.
            nullable: true
          SatisfactionLevel:
            allOf:
