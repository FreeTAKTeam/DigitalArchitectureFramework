            description: 'has Cost Period (Capability Has Cost Period). Ids of the dCostPeriod elements; multiplicity 0..*. The direct cost of the capability in one period: cost no linked role or application
              carries. Its full cost is derived by adding the cost periods of its linked roles and applications.'
