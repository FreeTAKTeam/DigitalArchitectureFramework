    dAPI:
      description: OpenAPI Specification is an open-source format and initiative for designing and creating machine-readable interface files that are utilized in producing, describing, consuming, and visualizing
        RESTful APIs and web services.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          basePath:
            type: string
            description: The path, relative to the host, under which all operations are served. It starts with a slash, e.g. /v1. Use / when the API is served at the root of the host.
            nullable: true
          consumes:
            type: array
            items:
              $ref: '#/components/schemas/MimeTypes'
            description: The MIME types every operation accepts by default, e.g. application/json. An operation can override it.
          contact:
            type: string
            format: uuid
            x-reference: '#/components/schemas/SupportingClass_Contact'
            description: 'Who to contact about the API: name, e-mail and URL.'
            nullable: true
          definitions:
            type: string
            description: The data types the operations send and receive, as a reference to the schema that defines them, e.g. the name of a dJSON_Schema.
            nullable: true
          Full Name:
            type: string
            description: The full, human-readable name of the API, e.g. "Claims Intake API".
            nullable: true
          host:
            type: string
            description: The host name or IP address that serves the API, optionally with a port, e.g. api.example.com:8443. No scheme and no path. Absent means the host that serves the documentation.
            nullable: true
          license:
            type: string
            description: The licence the API is published under, as a name or URL, e.g. "Apache-2.0".
            nullable: true
          parameters:
            type: string
            description: Parameters shared by several operations, defined once here and referenced by the operations.
            nullable: true
          produces:
            type: array
            items:
              $ref: '#/components/schemas/MimeTypes'
            description: The MIME types every operation returns by default, e.g. application/json. An operation can override it.
          responses:
            type: string
            description: Responses shared by several operations, defined once here and referenced by the operations.
            nullable: true
          schemes:
            type: array
            items:
              $ref: '#/components/schemas/SchemeType'
            description: The transfer protocols the API supports (http, https, ws, wss). Absent means the scheme used to read the API description.
          securityDefinitions:
            type: string
            description: The security schemes the API uses, e.g. "OAuth2 authorization code", "API key in header X-Api-Key".
            nullable: true
          swagger:
            type: string
            description: The OpenAPI (Swagger) specification version the API description follows, e.g. "2.0". Tools use it to read the rest of the description.
          tags:
            type: string
            description: Comma-separated tags that group the API's operations, e.g. "claims, policies".
            nullable: true
          dAPIAggregatesSchema:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dJSON_Schema'
            description: Aggregates Schema (Aggregates Schema). Ids of the dJSON_Schema elements; multiplicity 0..*.
          dServiceRealizedByAPI:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dPhysicalService'
            description: realized Physical Service (Service Realized By API). Ids of the dPhysicalService elements; multiplicity 0..1.
            nullable: true
        required:
        - swagger
    dAPIOperation:
      description: Defines operations exposed by an API for interaction with external systems. Also called endpoints.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          base_Operation:
            type: string
            description: The UML operation this API operation is generated from or extends, when the API is derived from a class model.
            nullable: true
          consumes:
            type: string
            description: The MIME types this operation accepts, comma-separated, e.g. application/json. Empty means the API's default.
            nullable: true
          deprecated:
            type: boolean
            description: true when the operation is deprecated and clients should stop using it; otherwise false.
            nullable: true
          description:
            type: string
            description: A longer explanation of the operation's behaviour, rules and side effects.
            nullable: true
          hTTPMethod:
            allOf:
            - $ref: '#/components/schemas/HTTPMethod'
            description: The HTTP method of the operation, e.g. get to read, post to create, put or patch to change, delete to remove.
          produces:
            type: string
            description: The MIME types this operation returns, comma-separated, e.g. application/json. Empty means the API's default.
            nullable: true
          relativePath:
            type: string
            description: The path of the operation relative to the API's basePath, with path parameters in braces, e.g. /claims/{claimId}.
          schemes:
            type: string
            description: The transfer protocols for this operation, e.g. https. Empty means the API's default.
            nullable: true
          summary:
            type: string
            description: A one-line summary of what the operation does, e.g. "Register a new claim".
            nullable: true
          tags:
            type: string
            description: Comma-separated tags that group this operation with others in documentation, e.g. "claims".
            nullable: true
        required:
        - hTTPMethod
        - relativePath
    dAPIParameter:
      description: Defines parameters in API operations.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          allowEmptyValue:
            type: boolean
            description: true when a query or form parameter may be sent with an empty value; otherwise false.
            nullable: true
          base_Parameter:
            type: string
            description: The UML parameter this API parameter is generated from or extends, when the API is derived from a class model.
            nullable: true
          collectionFormat:
            type: string
            description: 'How an array parameter is serialised: csv, ssv, tsv, pipes or multi. Empty for parameters that are not arrays.'
            nullable: true
          location:
            type: string
            description: 'Where the parameter is passed: path, query, header, body or formData.'
          required:
            type: boolean
            description: true when the client must send the parameter; otherwise false. Path parameters are always required.
            nullable: true
        required:
        - location
    dAPIResponse:
      description: Represents responses returned by API operations.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          base_Parameter:
            type: string
            description: The UML element this response is generated from or extends, when the API is derived from a class model.
            nullable: true
          default:
            type: boolean
            description: true when this is the default response, used for any status code not described separately; otherwise false.
            nullable: true
          examples:
            type: string
            description: Example payloads for the response, keyed by MIME type.
            nullable: true
          headers:
            type: string
            description: 'The headers returned with the response, with their types, e.g. "Location: string".'
            nullable: true
          Integer:
            type: integer
            description: The HTTP status code of the response, e.g. 200, 201, 404.
        required:
        - Integer
    dAction:
      description: A specialized activity.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          dActivityContainsAction_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dActivity'
            description: contains Action (Activity contains Action). Ids of the dActivity elements; multiplicity 0..*.
    dActivity:
      description: Represents business or system activities. A function or work carried out by the business user.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          dActivityContainsAction:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dAction'
            description: is contained in Activity (Activity contains Action). Ids of the dAction elements; multiplicity 0..*.
          dUseCaseContainsActivities_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dBusinessUseCase'
            description: part of UseCase (Use Case Contains Activities). Ids of the dBusinessUseCase elements; multiplicity 0..*.
    dActor:
      description: Represents an entity (such as a person, system, or organization) that interacts with the system to achieve a specific goal. An actor typically performs actions within business Use cases
        and can be internal (e.g., employees) or external (e.g., customers or partner organizations), active and passive.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          ActorGoal:
            type: string
            description: What this actor wants to achieve when it deals with the organisation, in one or two sentences, e.g. "get a claim paid quickly".
            nullable: true
          ActorTasks:
            type: string
            description: The main tasks this actor performs, in general terms, e.g. "files claims, uploads documents". Detailed behaviour belongs in use cases and processes.
            nullable: true
          ActorType:
            allOf:
            - $ref: '#/components/schemas/ActorTypes'
            description: 'The kind of actor: a worker (internal or external) or a business partner (active or passive). Absent means not known; Not Set says the same and is kept for older models.'
            nullable: true
          Count:
            allOf:
            - $ref: '#/components/schemas/dQuantityValue'
            description: How many parties act as this actor. Use unit {FTE} for staff and a party unit such as {customer} or {policy} for a customer segment. Absent means not counted.
            nullable: true
          dActorParticipatesInBizUseCase:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dBusinessUseCase'
            description: Partecipates in Use Case (Actor Participates In Use Case). Ids of the dBusinessUseCase elements; multiplicity 0..*.
          dContractServesActor_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dContract'
            description: served by contract (Contract Serves Actor). Ids of the dContract elements; multiplicity 0..*.
          dRoleIsPerformedByActor:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dRole'
            description: has Role (Role isPerformed By Actor). Ids of the dRole elements; multiplicity 0..*.
    dApplicationComponent:
      description: 'An application component is a self-contained unit. As such, it is independently deployable, re-usable, and replaceable. An application component performs one or more application functions.
        It encapsulates its behavior and data, exposes services, and makes them available through interfaces. Cooperating application components are connected via application collaborations.


        An application component may be assigned to one or more application functions. An application component has one or more application interfaces, which expose its functionality. Application interfaces
        of other application components may serve an application component. The name of an application component should preferably be a noun.'
      allOf:
      - $ref: '#/components/schemas/dLogicalAppComponent'
      - type: object
        properties:
          ApplicationType:
            allOf:
            - $ref: '#/components/schemas/dApplicationType'
            description: The kind of application, e.g. COTS for a bought package, Custom for one built in-house, DB for a database.
            nullable: true
          BizCriticality:
            type: integer
            description: How critical the application is to the business, on a scale of 1 (can be switched off) to 100 (the business stops without it).
            nullable: true
          BizSatisfaction:
            type: integer
            description: How satisfied the business is with the application, on a scale of 1 (very unhappy) to 100 (fully satisfied).
            nullable: true
          Category:
            type: string
            description: A free categorisation of the application, following your own taxonomy, e.g. "Core insurance", "Back office".
            nullable: true
          depreciationMethod:
            allOf:
            - $ref: '#/components/schemas/dDepreciationMethod'
            description: 'How its Capex is spread over usefulLife: StraightLine or DecliningBalance. The depreciation schedule is derived from the Capex cost periods, inServiceDate, usefulLife and this
              method; it is not stored.'
            nullable: true
          inServiceDate:
            type: string
            format: date
            description: The date the asset went into use; depreciation starts here. Absent means not recorded.
            nullable: true
          InvestmentStrategy:
            allOf:
            - $ref: '#/components/schemas/dApplicationStrategy'
            description: 'What you plan to do with the application: Retain, Rehost, Replatform, Refactor, Rewrite or Retire.'
            nullable: true
          ITSatisfaction:
            type: integer
            description: How satisfied IT is with the application, on a scale of 1 to 100. Low values usually signal technical debt.
            nullable: true
          LastStandardReviewDate:
            type: string
            format: date-time
            description: When the application was last reviewed against the architecture standards.
            nullable: true
          NextStandardReviewDate:
            type: string
            format: date-time
            description: When the application is next due for review against the architecture standards.
            nullable: true
          Owner:
            type: string
            description: The person or team accountable for the application.
            nullable: true
          Port:
            type: string
            description: The network port the application listens on, e.g. 8443, when it exposes one.
            nullable: true
          RetireDate:
            type: string
            format: date
            description: The date the application is, or is planned to be, switched off. When an initiative retires the application, use that initiative's finish date or later. Absent means no retirement
              is planned.
            nullable: true
          Source:
            type: string
            description: Where the information about this application came from, e.g. a document, interview or tool export.
            nullable: true
