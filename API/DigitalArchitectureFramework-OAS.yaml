    dContract:
      description: Provides an agreement between a service consumer and a service provider that establishes functional and non-functional parameters for interaction.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          AvailabilityCharacteristics:
            type: string
            description: The availability the provider must deliver, e.g. "99.9 % per month".
            nullable: true
          billableUnit:
            type: string
            description: 'The unit that is billed, as a UCUM code: a usage unit such as {transaction} or GBy for PerUnit, or a party such as {policy} or {subscriber} for PerPartyPerPeriod.'
            nullable: true
          ConsumingService:
            type: string
            description: The name of the service that uses this contract. Prefer the contract's relationships when the service is in the model.
            nullable: true
          Description:
            type: string
            description: A short description of what the contract covers. When pricingBasis is Other, explain the pricing here.
            nullable: true
          effectiveFrom:
            type: string
            format: date
            description: The first day the contract applies. Absent means it applies from before the model's time frame.
            nullable: true
          effectiveTo:
            type: string
            format: date
            description: The last day the contract applies; after effectiveFrom. Absent means open-ended.
            nullable: true
          Growth:
            type: string
            description: The expected growth of demand under the contract, e.g. "+5 % per year".
            nullable: true
          Owner:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dRole'
            description: The role accountable for the contract.
            nullable: true
          pricingBasis:
            allOf:
            - $ref: '#/components/schemas/dPricingBasis'
            description: 'What the price is charged for. Read it together with billableUnit and tariff: PerUnit (tariff x units used), PerPartyPerPeriod (tariff per party per tariff.per), FlatFee (tariff
              per tariff.per), Tiered (volume bands, not modelled) or Other (explained in Description). Absent means not priced.'
            nullable: true
          ProvidingService:
            type: string
            description: The name of the service that provides this contract. Prefer the contract's relationships when the service is in the model.
            nullable: true
          renewal:
            type: string
            format: duration
            description: How often the contract renews, as an xsd:duration, e.g. P1Y. Absent means it does not renew automatically.
            nullable: true
          ResponseRequirements:
            type: string
            description: The response times the provider must meet, e.g. "95 % of requests within 2 s".
            nullable: true
          ServiceTimes:
            type: string
            description: When the service must be available, e.g. "Mon-Fri 08:00-18:00 ET" or "24x7".
            nullable: true
          Source:
            type: string
            description: Where the information about this contract came from, e.g. the signed agreement.
            nullable: true
          tariff:
            type: array
            items:
              $ref: '#/components/schemas/dQuantityValue'
            description: The price components, each a quantity with its own basis, e.g. 105 CAD per P1M basis "per unit" and 1 CAD per P1M basis "per door". Their sum is the price. Read together with pricingBasis
              and billableUnit.
          Throughput:
            type: string
            description: The capacity the provider must support, e.g. "500 requests per second".
            nullable: true
          ContractRelatedProduct:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dProduct'
            description: relates to Product (Contract is Related to Product). Ids of the dProduct elements; multiplicity 0..*.
          dContractHasRevenuePeriod:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dRevenuePeriod'
            description: has Revenue Period (Contract Has Revenue Period). Ids of the dRevenuePeriod elements; multiplicity 0..*. The recurring revenue billed under the contract in one period, e.g. a service
              subscription.
          dContractServesActor:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dActor'
            description: is serving actor (Contract Serves Actor). Ids of the dActor elements; multiplicity 0..*. a contract is serving a actor of type Partner
    dController:
      description: Encapsulates application behavior and flow logic.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          dActionKey:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dController'
            description: target Controller (Action Key). Ids of the dController elements; multiplicity 0..*.
          dActionKey_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dController'
            description: Source Controller (Action Key). Ids of the dController elements; multiplicity 0..*.
          dControllerControlsModel:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dModelClass'
            description: Controls Model (Controls Model). Ids of the dModelClass elements; multiplicity 0..*.
          dControllerGovernsView:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dView'
            description: Governs view (Governs View). Ids of the dView elements; multiplicity 0..*.
          dControllerImplementsFunction:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dApplicationFunction'
            description: Implements function (controller Implements function). Ids of the dApplicationFunction elements; multiplicity 0..1.
            nullable: true
          dObjectInstanceofController_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dObject'
            description: Istance of Controller (Instance of Controller). Ids of the dObject elements; multiplicity 0..*.
          dUseCaseisImplementedByController:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dBusinessUseCase'
            description: implements Use Case (Use Case is Implemented By Controller). Ids of the dBusinessUseCase elements; multiplicity 0..*.
    dCostPeriod:
      description: Spend, or a spending cap, of one element in one period, planned or actual. Spend belongs to an initiative, application, role, capability, product or resource; a cap belongs to a program
        (its budget). costNature says whether it is capital or operating spend, and costFunction which line of the income statement an operating cost lands on. Spend can be included in the financial period
        of the organisation unit whose books it lands in (dFinancialPeriodIncludesCostPeriod).
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          amount:
            allOf:
            - $ref: '#/components/schemas/dQuantityValue'
            description: The money spent, or allowed, in the period, with an ISO 4217 currency as unit. Use kind Actual for spend that happened and Estimate for a plan.
          costFunction:
            allOf:
            - $ref: '#/components/schemas/dCostFunction'
            description: 'For an operating cost, the line of the income statement it lands on: CostOfRevenue, SellingGeneralAdmin or ResearchDevelopment. Not set for Capex, which is not an income-statement
              cost. Absent means not classified.'
            nullable: true
          costNature:
            allOf:
            - $ref: '#/components/schemas/dCostNature'
            description: Whether the amount is capital (Capex) or operating (Opex) expenditure. Absent means the amount covers both, as a budget cap does.
            nullable: true
          periodLength:
            type: string
            format: duration
            description: The length of the period, as an xsd:duration, e.g. P1M, P3M, P1Y. The cost periods of one owner must not overlap.
          periodStart:
            type: string
            format: date
            description: The first day of the period.
          dApplicationComponentHasCostPeriod_inverse:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dApplicationComponent'
            description: is cost of Application (Application Has Cost Period). Ids of the dApplicationComponent elements; multiplicity 0..1.
            nullable: true
          dCapabilityHasCostPeriod_inverse:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dCapability'
            description: is direct cost of Capability (Capability Has Cost Period). Ids of the dCapability elements; multiplicity 0..1.
            nullable: true
          dFinancialPeriodIncludesCostPeriod_inverse:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dFinancialPeriod'
            description: is included in Financial Period (Financial Period Includes Cost Period). Ids of the dFinancialPeriod elements; multiplicity 0..1.
            nullable: true
          dInitiativeHasCostPeriod_inverse:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dInitiative'
            description: is cost of Initiative (Initiative Has Cost Period). Ids of the dInitiative elements; multiplicity 0..1.
            nullable: true
          dProductHasCostPeriod_inverse:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dProduct'
            description: is cost of Product (Product Has Cost Period). Ids of the dProduct elements; multiplicity 0..1.
            nullable: true
          dProgramHasBudgetPeriod_inverse:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dProgram'
            description: is budget of Program (Program Has Budget Period). Ids of the dProgram elements; multiplicity 0..1.
            nullable: true
          dResourceHasCostPeriod_inverse:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dResource'
            description: is cost of Resource (Resource Has Cost Period). Ids of the dResource elements; multiplicity 0..1.
            nullable: true
          dRoleHasCostPeriod_inverse:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dRole'
            description: is cost of Role (Role Has Cost Period). Ids of the dRole elements; multiplicity 0..1.
            nullable: true
        required:
        - amount
        - periodLength
        - periodStart
    dDataEntity:
      description: An encapsulation of data that is recognized by a business domain expert as a thing. Logical data entities can be tied to applications, repositories, and services and may be structured
        according to implementation considerations.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          Category:
            type: string
            description: A free categorisation of the data entity, following your own taxonomy, e.g. "Master data", "Transaction".
            nullable: true
          isAccessible:
            type: boolean
            description: true when the people and systems that need the data can get it; otherwise false.
            nullable: true
          isAccurate:
            type: boolean
            description: true when the data correctly represents the real-world thing it describes; otherwise false.
            nullable: true
          isTimely:
            type: boolean
            description: true when the data is up to date when it is used; otherwise false.
            nullable: true
          Owner:
            type: string
            description: The person or role accountable for the data (the data owner).
            nullable: true
          PrivacyClassification:
            type: string
            description: How restricted access to the data is, following your classification scheme, e.g. Public, Internal, Confidential, Personal.
            nullable: true
          RetentionClassification:
            type: string
            description: How long the data must be kept, following your retention scheme, e.g. "7 years after policy end".
            nullable: true
          Source:
            type: string
            description: Where the information about this data entity came from, e.g. a data model or interview.
            nullable: true
          dBizServUsesDataEntity_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dBusinessService'
            description: is used by service (Service Uses Data). Ids of the dBusinessService elements; multiplicity 0..*.
          dDataEntityInformsCapability_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dCapability'
            description: Informs Capability (informs Capability). Ids of the dCapability elements; multiplicity 0..*.
          dEntityAssociatesEntity:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dDataEntity'
            description: Is connected to Source Entity (Entity Associates Entity). Ids of the dDataEntity elements; multiplicity 0..*.
          dEntityAssociatesEntity_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dDataEntity'
            description: Is connected to Target Entity (Entity Associates Entity). Ids of the dDataEntity elements; multiplicity 0..*.
          dModelClassRealizesEntity_inverse:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dModelClass'
            description: is realized by Class (Model Class Realizes Entity). Ids of the dModelClass elements; multiplicity 1.
        required:
        - dModelClassRealizesEntity_inverse
    dDecision:
      description: Represents decisions and their impact on architecture or processes.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          Alternatives:
            type: string
            description: The options considered, each with a short explanation of its pros and cons.
            nullable: true
          Assumptions:
            type: string
            description: What is believed to be true about the problem and the constraints on the solution when the decision is taken.
            nullable: true
          Decision:
            type: string
            description: The option chosen, stated clearly, with references to related work products if needed.
            nullable: true
          Implications:
            type: string
            description: 'What follows from the decision: work to do, constraints it adds, and risks it creates.'
            nullable: true
          Justification:
            type: string
            description: Why this option was chosen, how it complies with the architecture principles, and why any deviation from them is accepted.
            nullable: true
          Motivation:
            type: string
            description: Why the decision matters and why it has to be taken now.
            nullable: true
          RelatedDecisions:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dDecision'
            description: Other decisions this one depends on, replaces or affects.
          Subject Area:
            type: string
            description: The area of concern the decision belongs to, e.g. "Integration", "Data".
            nullable: true
          Topic:
            type: string
            description: The specific question the decision answers, e.g. "Which message broker for claims events?".
          dDecisionRefersToPrinciple:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dPrinciple'
            description: refers To Principle (Decision refers To Principle). Ids of the dPrinciple elements; multiplicity 1..*.
          dInitiativeisMakingUseOfDecision:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dInitiative'
            description: is used in Initiative (Initiative is Making Use Of Decision). Ids of the dInitiative elements; multiplicity 0..*.
        required:
        - Topic
        - dDecisionRefersToPrinciple
    dDeploymentModel:
      description: The root class for the description of a Deployments to roll out an application, service, or container to a set of resources. akin to ArchiMate's Technology Layer deployment views.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          dDeploymentModelAggregatesCluster:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dCluster'
            description: Aggregates Cluster (Deployment Model Aggregates Cluster). Ids of the dCluster elements; multiplicity 1..*.
        required:
        - dDeploymentModelAggregatesCluster
    dDeploymentNode:
      description: Represents a physical machine or virtual server that hosts services, applications, or containers, akin to ArchiMate’s Node concept in the Technology Layer.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          ArchitectureType:
            allOf:
            - $ref: '#/components/schemas/ArchitectureType'
            description: The CPU architecture of the node, e.g. AMD64, ARM64.
            nullable: true
          CPU:
            type: string
            description: The number and type of CPUs, e.g. "8 vCPU Intel Xeon".
            nullable: true
          Disk:
            type: string
            description: The disk capacity of the node, with its unit, e.g. "500 GB SSD".
            nullable: true
          hostname:
            type: string
            description: The host name of the node on the network, e.g. claims-db-01.
            nullable: true
          IP:
            type: string
            description: The private IP address of the node, e.g. 10.0.4.12.
            nullable: true
          OS:
            type: string
            description: The operating system and version installed on the node, e.g. "Ubuntu 24.04 LTS".
            nullable: true
          Owner:
            type: string
            description: The person or team responsible for the node.
            nullable: true
          PublicIP:
            type: string
            description: The public IP address of the node, when it has one. Leave empty for nodes reachable only on the private network.
            nullable: true
          RAM:
            type: string
            description: The memory of the node, with its unit, e.g. "32 GB".
            nullable: true
          dApplicationRunsInNode:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dApplicationComponent'
            description: Runs Application (Application is run By Node). Ids of the dApplicationComponent elements; multiplicity 0..*.
          dClusterContainsDeploymentNode_inverse:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dCluster'
            description: is Contained in Cluster (Cluster Contains Node). Ids of the dCluster elements; multiplicity 1.
          dLocationHostsNode_inverse:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dLocation'
            description: Is hosted in Location (Location Hosts Node). Ids of the dLocation elements; multiplicity 1.
          dNetworkContainsNode_inverse:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dNetwork'
            description: is contained in a Network (Contains Node). Ids of the dNetwork elements; multiplicity 0..1.
            nullable: true
        required:
        - dClusterContainsDeploymentNode_inverse
        - dLocationHostsNode_inverse
    dEvent:
      description: Something that happens, inside or outside the organization, that triggers behaviour or results from it.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          duration:
            type: string
            format: duration
            description: How long the event lasts, as an xsd:duration, e.g. PT4H. Use it when the dates are not known.
            nullable: true
          endDate:
            type: string
            format: date-time
            description: When the event, or the window of a possible event, ends; after startDate. Absent means it has not ended or is instantaneous.
            nullable: true
          eventType:
            allOf:
            - $ref: '#/components/schemas/dEventType'
            description: 'Where the event comes from: Business (a business fact), Temporal (a point in time, e.g. month end), External (outside the organisation) or Technical (a system event). Absent means
              not classified.'
            nullable: true
          frequency:
            allOf:
            - $ref: '#/components/schemas/dQuantityValue'
            description: How often a recurring event happens, as a count per period, e.g. 120 {claim} per P1D. Set only when nature is Recurring.
            nullable: true
          likelihood:
            type: integer
            description: How likely a possible event is, on a scale of 1 (very unlikely) to 100 (almost certain), as for dRisk.likelihood. Set only when nature is Possible.
            nullable: true
          nature:
            allOf:
            - $ref: '#/components/schemas/dEventNature'
            description: 'Recurring: a designed trigger that happens regularly (set frequency). Possible: an event in a scenario that may happen (set likelihood). Occurred: an event that has happened (set
              startDate).'
            nullable: true
          owner:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dRole'
            description: The role accountable for responding to the event.
            nullable: true
          Source:
            type: string
            description: Where the information about this event came from, e.g. an incident record or a scenario workshop.
            nullable: true
          startDate:
            type: string
            format: date-time
            description: When an occurred event started, or when the window of a possible event opens.
            nullable: true
          dEventLeadsToEvent:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dEvent'
            description: leads to Event (Event Leads to Event). Ids of the dEvent elements; multiplicity 0..*.
          dEventLeadsToEvent_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dEvent'
            description: follows Event (Event Leads to Event). Ids of the dEvent elements; multiplicity 0..*.
          dEventTriggersProcess:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dBusinessProcess'
            description: triggers Process (Event Triggers Process). Ids of the dBusinessProcess elements; multiplicity 0..*.
          dProcessResultsInEvent_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dBusinessProcess'
            description: is result of Process (Process Results in Event). Ids of the dBusinessProcess elements; multiplicity 0..*.
    dFeature:
      description: A Feature is a fact that set his related Requirement to be true
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          Author:
            type: string
            description: 'Who wrote the feature: name and role in the project, e.g. "Ana Diaz, Analyst".'
            nullable: true
          isImplemented:
            type: boolean
            description: true when the feature has been built and delivered; otherwise false.
            nullable: true
          Proofreader:
            type: string
            description: 'Who checked the feature: name and role in the project, e.g. "Tom Lee, Client".'
            nullable: true
          dFeatureIsRealizedByUseCase_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dBusinessUseCase'
            description: is realized by Use Case (Feature is realized by Use Case). Ids of the dBusinessUseCase elements; multiplicity 0..*.
          dRequirementIsSatisfiedByFeature:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dRequirement'
            description: realizes Requirement (is Satisfied By). Ids of the dRequirement elements; multiplicity 0..*.
    dFinancialPeriod:
      description: An organisation unit's reported or planned results for one period. It holds the income-statement lines (revenue, costOfRevenue, operatingExpense, depreciation, interestExpense, incomeTax),
        the cash line capitalExpenditure, and investment figures. Subtotals such as gross margin, EBITDA, EBIT, net income and free cash flow are derived from these lines and are never stored. The cost
        and revenue periods it includes show where its figures come from. Linked to its unit by dOrganizationUnitReportsFinancialPeriod. Use kind Actual on its amounts for reported results and Estimate
        for a plan.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          capitalExpenditure:
            allOf:
            - $ref: '#/components/schemas/dQuantityValue'
            description: Capital spend in the period, a cash line that is not part of the income statement; it reaches the income statement later as depreciation. It includes the included cost periods whose
              costNature is Capex. Same currency as revenue.
            nullable: true
          costOfRevenue:
            allOf:
            - $ref: '#/components/schemas/dQuantityValue'
            description: The direct cost of what was sold in the period, e.g. claims incurred for an insurer. It includes the included cost periods whose costFunction is CostOfRevenue. Same currency as
              revenue.
            nullable: true
          depreciation:
            allOf:
            - $ref: '#/components/schemas/dQuantityValue'
            description: 'Depreciation charged in the period: the share of earlier Capex spread over the assets'' useful life. A non-cash cost. Same currency as revenue.'
            nullable: true
          incomeTax:
            allOf:
            - $ref: '#/components/schemas/dQuantityValue'
            description: Income tax charged in the period. Same currency as revenue.
            nullable: true
          interestExpense:
            allOf:
            - $ref: '#/components/schemas/dQuantityValue'
            description: Interest paid or accrued on debt in the period. Same currency as revenue.
            nullable: true
          investedAssets:
            allOf:
            - $ref: '#/components/schemas/dQuantityValue'
            description: The value of invested assets at the end of the period; set asOf to that date. Same currency as revenue.
            nullable: true
          investmentIncome:
            allOf:
            - $ref: '#/components/schemas/dQuantityValue'
            description: Income from invested assets in the period. Same currency as revenue.
            nullable: true
          operatingExpense:
            allOf:
            - $ref: '#/components/schemas/dQuantityValue'
            description: All other operating cost in the period, including revenueLinkedExpense and the included cost periods whose costFunction is SellingGeneralAdmin or ResearchDevelopment. Excludes depreciation.
              Same currency as revenue.
            nullable: true
          periodLength:
            type: string
            format: duration
            description: The length of the period, as an xsd:duration, e.g. P1Y for a fiscal year, P3M for a quarter. Periods of the same organisation unit must not overlap.
          periodStart:
            type: string
            format: date
            description: The first day of the period.
          revenue:
            allOf:
            - $ref: '#/components/schemas/dQuantityValue'
            description: Revenue earned in the period, e.g. net earned premium for an insurer, with an ISO 4217 currency as unit. It includes the revenue periods the statement includes (dFinancialPeriodIncludesRevenuePeriod).
              Use kind Actual for reported results and Estimate for a plan.
            nullable: true
          revenueLinkedExpense:
            allOf:
            - $ref: '#/components/schemas/dQuantityValue'
            description: The part of operatingExpense that grows and shrinks with revenue, e.g. commission and premium tax. Same currency as revenue.
            nullable: true
          dFinancialPeriodIncludesCostPeriod:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dCostPeriod'
            description: 'includes Cost Period (Financial Period Includes Cost Period). Ids of the dCostPeriod elements; multiplicity 0..*. The cost period is recorded in this statement: its amount is already
              part of the statement''s operatingExpense (Opex) or capitalExpenditure (Capex). A model must not add it again.'
          dFinancialPeriodIncludesRevenuePeriod:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dRevenuePeriod'
            description: 'includes Revenue Period (Financial Period Includes Revenue Period). Ids of the dRevenuePeriod elements; multiplicity 0..*. The revenue period is recorded in this statement: its
              amount is already part of the statement''s revenue. A model must not add it again.'
          dOrganizationUnitReportsFinancialPeriod_inverse:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dOrganizationUnit'
            description: is reported by Org Unit (Org Unit Reports Financial Period). Ids of the dOrganizationUnit elements; multiplicity 1.
        required:
        - periodLength
        - periodStart
        - dOrganizationUnitReportsFinancialPeriod_inverse
    dGoal:
      description: a Goal is a <b>measurable </b>scope that the organization wants to achieve. Can be hierarchically decomposed.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          AssumptionType:
            type: array
            items:
              $ref: '#/components/schemas/dAssumptionType'
            description: The levels at which assumptions were made to reach the goal, e.g. Business, Technology. The assumptions themselves belong in the simulation scenario, not here.
          Priority:
            type: integer
            description: How important the goal is compared with the others, as a percentage from 1 to 100.
            nullable: true
          Value_amount:
            allOf:
            - $ref: '#/components/schemas/dQuantityValue'
            description: 'The baseline: the level of the targeted KPI when the goal was set, e.g. 103.2 % for the combined ratio. Set asOf to that date. The unit equals the KPI''s UnitOfMeasure.'
            nullable: true
          Value_Goal:
            allOf:
            - $ref: '#/components/schemas/dQuantityValue'
            description: The change the goal aims for, from Value_amount, in the same unit. Negative means reduce, e.g. -6.2 % to take the combined ratio from 103.2 % to 97.0 %. The target level is Value_amount
              + Value_Goal; zero means hold the level. The deadline is the latest finishDate of the goal's objectives.
            nullable: true
          Value_Name:
            type: string
