  requestBodies:
    dAPI:
      description: OpenAPI Specification is an open-source format and initiative for designing and creating machine-readable interface files that are utilized in producing, describing, consuming, and visualizing
        RESTful APIs and web services.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dAPI'
      required: true
    dAPIOperation:
      description: Defines operations exposed by an API for interaction with external systems. Also called endpoints.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dAPIOperation'
      required: true
    dAPIParameter:
      description: Defines parameters in API operations.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dAPIParameter'
      required: true
    dAPIResponse:
      description: Represents responses returned by API operations.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dAPIResponse'
      required: true
    dAction:
      description: A specialized activity.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dAction'
      required: true
    dActivity:
      description: Represents business or system activities. A function or work carried out by the business user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dActivity'
      required: true
    dActor:
      description: Represents an entity (such as a person, system, or organization) that interacts with the system to achieve a specific goal. An actor typically performs actions within business Use cases
        and can be internal (e.g., employees) or external (e.g., customers or partner organizations), active and passive.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dActor'
      required: true
    dApplicationComponent:
      description: 'An application component is a self-contained unit. As such, it is independently deployable, re-usable, and replaceable. An application component performs one or more application functions.
        It encapsulates its behavior and data, exposes services, and makes them available through interfaces. Cooperating application components are connected via application collaborations.


        An application component may be assigned to one or more application functions. An application component has one or more application interfaces, which expose its functionality. Application interfaces
        of other application components may serve an application component. The name of an application component should preferably be a noun.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dApplicationComponent'
      required: true
    dApplicationFunction:
      description: Encapsulates functions supported by applications.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dApplicationFunction'
      required: true
    dBusinessArea:
      description: an organization of Business interests, can be decomposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dBusinessArea'
      required: true
    dBusinessProcess:
      description: A sequence of activities that produce a specific service or product supporting a particular business capability
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dBusinessProcess'
      required: true
    dBusinessService:
      description: "<ol>\n\t<li>A repeatable activity; a discrete behavior that a building block may be requested or otherwise triggered to perform.</li>\n\t<li>A service provided by Business that achieve\
        \ a business outcome in response to a request.</li>\n</ol>"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dBusinessService'
      required: true
    dBusinessUseCase:
      description: Encapsulates business processes producing value for an enterprise.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dBusinessUseCase'
      required: true
    dCapability:
      description: Represents an organizational capability to achieve business outcomes.Can be current available in an Organization Unit (or) A business-focused outcome that is delivered by the completion
        of one or more work packages (by increasing the capability Maturity).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dCapability'
      required: true
    dCluster:
      description: Represents a set of nodes working in the same Region, akin to ArchiMate’s Node concept within a server infrastructure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dCluster'
      required: true
    dContainer:
      description: Encapsulates application components and services, mirroring ArchiMate's concept of a Node, where an application runs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dContainer'
      required: true
    dContract:
      description: Provides an agreement between a service consumer and a service provider that establishes functional and non-functional parameters for interaction.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dContract'
      required: true
    dController:
      description: Encapsulates application behavior and flow logic.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dController'
      required: true
    dCostPeriod:
      description: Spend, or a spending cap, of one element in one period, planned or actual. Spend belongs to an initiative, application, role, capability, product or resource; a cap belongs to a program
        (its budget). costNature says whether it is capital or operating spend, and costFunction which line of the income statement an operating cost lands on. Spend can be included in the financial period
        of the organisation unit whose books it lands in (dFinancialPeriodIncludesCostPeriod).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dCostPeriod'
      required: true
    dDataEntity:
      description: An encapsulation of data that is recognized by a business domain expert as a thing. Logical data entities can be tied to applications, repositories, and services and may be structured
        according to implementation considerations.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dDataEntity'
      required: true
    dDecision:
      description: Represents decisions and their impact on architecture or processes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dDecision'
      required: true
    dDeploymentModel:
      description: The root class for the description of a Deployments to roll out an application, service, or container to a set of resources. akin to ArchiMate's Technology Layer deployment views.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dDeploymentModel'
      required: true
    dDeploymentNode:
      description: Represents a physical machine or virtual server that hosts services, applications, or containers, akin to ArchiMate’s Node concept in the Technology Layer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dDeploymentNode'
      required: true
    dEvent:
      description: Something that happens, inside or outside the organization, that triggers behaviour or results from it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dEvent'
      required: true
    dFeature:
      description: A Feature is a fact that set his related Requirement to be true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dFeature'
      required: true
    dFinancialPeriod:
      description: An organisation unit's reported or planned results for one period. It holds the income-statement lines (revenue, costOfRevenue, operatingExpense, depreciation, interestExpense, incomeTax),
        the cash line capitalExpenditure, and investment figures. Subtotals such as gross margin, EBITDA, EBIT, net income and free cash flow are derived from these lines and are never stored. The cost
        and revenue periods it includes show where its figures come from. Linked to its unit by dOrganizationUnitReportsFinancialPeriod. Use kind Actual on its amounts for reported results and Estimate
        for a plan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dFinancialPeriod'
      required: true
    dGoal:
      description: a Goal is a <b>measurable </b>scope that the organization wants to achieve. Can be hierarchically decomposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dGoal'
      required: true
    dGrowthPackage:
      description: A set of actions identified to achieve one or more objectives for the business. A work package can be a part of an Initiative, a complete project, or a part of a Program. A Growth pack
        is a collection of Initiatives architected for consistency and aimed to be executed in the same period.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dGrowthPackage'
      required: true
    dIPRange:
      description: Defines a range of IP addresses (CIDR) used within a network. This aligns with ArchiMate's concept of Infrastructure Service, providing connectivity.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dIPRange'
      required: true
    dInitiative:
      description: An activity carried out by a Business Unit or organization to achieve a particular goal or improve the Maturity of a certain capability.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dInitiative'
      required: true
    dIssue:
      description: Am issue is a  concrete problem that is affecting a business. Also, a fact that sets a Requirement to be false. (see also Risk)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dIssue'
      required: true
    dJSON_Attribute:
      description: Defines attributes in JSON data structures.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dJSON_Attribute'
      required: true
    dJSON_Datatype:
      description: Represents a data type used within JSON structures, defining the format and constraints of data elements in a schema. JSON Data Types include standard types such as string, number, object,
        array, boolean, and null, ensuring consistency and validation in data exchange between systems.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dJSON_Datatype'
      required: true
    dJSON_Element:
      description: Represents elements or nodes in JSON schemas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dJSON_Element'
      required: true
    dJSON_Schema:
      description: The Schema Object allows the definition of input and output data types. These types can be objects, but also primitives and arrays. This object is based on the JSON Schema Specification
        Draft 4 and uses a predefined subset of it. On top of this subset, there are extensions provided by this specification to allow for more complete documentation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dJSON_Schema'
      required: true
    dJSON_SchemaSubSet:
      description: Represents subsets of JSON schema structures.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dJSON_SchemaSubSet'
      required: true
    dJSON_Type:
      description: Represents data type definitions for structured information.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dJSON_Type'
      required: true
    dLocation:
      description: A place where business activity takes place and can be hierarchically decomposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dLocation'
      required: true
    dLogicalAppComponent:
      description: Encapsulates logical software components independent of implementation or technology.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dLogicalAppComponent'
      required: true
    dMeasurementArea:
      description: Represents areas of organizational or business performance measurement. The organization or Business units performance objective is captured as measurement area.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dMeasurementArea'
      required: true
    dMeasurementCategory:
      description: Categorizes measurements within a measurement area.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dMeasurementCategory'
      required: true
    dMeasurementGrouping:
      description: a groups of Measurement Indicator that can be aggregated into Categories
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dMeasurementGrouping'
      required: true
    dMeasurementIndicator:
      description: The specific measure captured for a Organization or Business Unit which can be measured and quantifiable.  A measurement is a Key Performance indicator
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dMeasurementIndicator'
      required: true
    dModelClass:
      description: Represent a class of the domain model, that can be converted into a Persistent domain class, must inherit from Node. It is the application's dynamic data structure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dModelClass'
      required: true
    dNetwork:
      description: The main communication medium between services and deployments, mapped to ArchiMate Communication Networks, facilitating inter-service communication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dNetwork'
      required: true
    dObject:
      description: an Object is an instance of a class in a particular moment in runtime that can have its own state and data values.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dObject'
      required: true
    dObjective:
      description: The Objective is a non material achievement, other than a Goal, the objective has no specific value to be measured. it's a time-bounded <b>milestone </b>for an organization used to demonstrate
        progress towards a goal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dObjective'
      required: true
    dOnPremise:
      description: an organization of Business interests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dOnPremise'
      required: true
    dOpinion:
      description: A view or judgment formed about a Topic. That is formulated in an explicit fashion. Captures explicit stakeholder judgments on a topic.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dOpinion'
      required: true
    dOpinionInner:
      description: 'Captures implicit stakeholder opinions related to a topic.

        A Stakeholder’s opinion that is relevant for the topic but is not formulated explicitly.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dOpinionInner'
      required: true
    dOrganizationUnit:
      description: Defines organizational units responsible for roles, can be decomposed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dOrganizationUnit'
      required: true
    dPhysicalService:
      description: a technical implementation of a service that runs on physical or virtual infrastructure, providing specific functionalities, usually in the form of software applications, middleware,
        databases, or platforms. It is concerned with the deployment, operation, and management of the technology stack, ensuring that the service is available, performant, and reliable. Examples include
        web servers, APIs, databases, and network services.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dPhysicalService'
      required: true
    dPrinciple:
      description: Defines qualitative statements guiding architecture intent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dPrinciple'
      required: true
    dProduct:
      description: Encapsulates outputs produced by business processes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dProduct'
      required: true
    dProgram:
      description: A group of Growth Packages that achieve a complex outcome for the organization
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dProgram'
      required: true
    dPublicCluster:
      description: A public cloud-based cluster, following the ArchiMate concept of Infrastructure Service provided by external cloud providers (Google, AWS, etc.).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dPublicCluster'
      required: true
    dRegion:
      description: A geographic area containing clusters and zones, aligned with ArchiMate's Location concept for representing deployment geography.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dRegion'
      required: true
    dRequirement:
      description: "A Business guide line about the Enterprise or the project. Requirements can be decomposed.\n A requirement is formulated in a SMART fashion and uses Moscow verbs (Must Have, Should Have,\
        \ Could Have, and Would Like to Have.).\n<ul>\n\t<li><b>Must Have</b>: These are the requirements that are considered essential for the success of the initiative and must be meet for the system\
        \ to function. They are often referred to as \"hard\" or \"mandatory\". requirements and are typically expressed in Boolean format as \"true\" or \"1\". </li>\n\t<li><b>Should Have</b>: These are\
        \ the requirements that are considered important, but not essential. They are typically expressed in Boolean format as \"maybe\" or \"0/1\" and are often used to prioritize the development of the\
        \ system.</li>\n\t<li></li>\n\t<li><b>Could Have</b>: These are the requirements that are considered desirable but not essential. They are typically expressed in Boolean format as \"false\" or \"\
        0\". They are used to identify potential enhancements to the system that can be added at a later date.</li>\n\t<li><b>Would Like to Have</b>: These are the requirements that are considered less\
        \ important and are often used to identify potential future enhancements to the system.</li>\n</ul>\nIn addition, the requirement should be SMART, which stands for Specific, Measurable, Achievable,\
        \ Relevant, and Time-bound. SMART requirements are clear, concise, and easy to understand, and they provide a clear way to measure the success of the project."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dRequirement'
      required: true
    dResource:
      description: a type of Asset supporting a Business capability
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dResource'
      required: true
    dRevenuePeriod:
      description: Revenue earned by one product or contract in one period, reported (kind Actual) or planned (kind Estimate). It can be included in the financial period of the organisation unit whose books
        it lands in (dFinancialPeriodIncludesRevenuePeriod).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dRevenuePeriod'
      required: true
    dRisk:
      description: a risk Identifies and assesses potential issue impacting other elements. It is a potential future Issue. Can be hierarchically decomposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dRisk'
      required: true
    dRole:
      description: The usual or expected function of an actor, or the part somebody or something plays in a particular action or event. An actor may have a number of roles.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dRole'
      required: true
    dSecurityGroup:
      description: Controls and manages access and permissions between services, in line with TOGAF's Security Architecture for protecting digital assets.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dSecurityGroup'
      required: true
    dSkill:
      description: an ability that some role possesses with various degree
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dSkill'
      required: true
    dStakeholder:
      description: Represents any party or force influencing the domain of interest. Any person or force that have an interest in the considered domain. This is typically indicated by name, can be connected
        with a Role in the organization. A stakeholder has open and Inner opinions that are relevant for the subject matter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dStakeholder'
      required: true
    dSubNetwork:
      description: A subset of a network, used to organize and isolate portions of the network. Equivalent to an ArchiMate Node, responsible for networking resources.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dSubNetwork'
      required: true
    dSystem:
      description: 'A system configuration. Settings are modeled as attributes with default values, each attribute of the System Config becomes a line in the configuration file.

        e.g. SystemConfig .path = c:/users/app'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dSystem'
      required: true
    dTable:
      description: Represents physical tables in a database schema.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dTable'
      required: true
    dTest:
      description: Represents a mechanism for verifying or validating the functionality, behavior, or compliance of am application component . Tests can include automated or manual procedures designed to
        ensure alignment with requirements, detect defects, and confirm expected outcomes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dTest'
      required: true
    dUserStory:
      description: Captures user-centric requirements expressed as stories.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dUserStory'
      required: true
    dValue:
      description: An attribute of a Node value type used in DAF. These values are persistent
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dValue'
      required: true
    dValueRef:
      description: A Node value type used in DAF that reference another Node Value, similar to a foreign Key. These values are persistent
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dValueRef'
      required: true
    dValueStream:
      description: "A representation of  an end-to end collection  of value-adding  Business Processes that create an overall result for a customer, stakeholder or end user. \nA sequence of activities an\
        \ enterprise undertakes to deliver on a customer request. More broadly, the sequence of activities required to design, produce, and deliver a good or service to a customer, and it includes the dual\
        \ flows of information and material."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dValueStream'
      required: true
    dView:
      description: A View used in DAF. Controller, Views and Associations define the application flow
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dView'
      required: true
    dVolume:
      description: Refers to the storage assigned to containers, ensuring persistence, aligning with the Data Object in ArchiMate’s Application Layer.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dVolume'
      required: true
    dZone:
      description: Defines macro divisions containing regions mapped to ArchiMate’s Infrastructure Service.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dZone'
      required: true
