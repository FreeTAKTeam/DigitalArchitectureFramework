            description: Child Goal (Goal Aggregates Goal). Ids of the dGoal elements; multiplicity 0..*.
          dGoalhasObjective:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dObjective'
            description: Has Objective (Goal has Milestone). Ids of the dObjective elements; multiplicity 0..*. The objectives are the goal's milestones. The goal's deadline is the latest finishDate among
              them.
          dGoalisOperationalizedByCapability_inverse:
            type: array
            items:
              type: string
              format: uuid
