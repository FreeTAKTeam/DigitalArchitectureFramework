components:
  schemas:
    DAFBase:
      description: 'Common metadata for every DAF resource. The stable identifier policy is UUID: id is a server-assigned UUID and is immutable. Properties marked readOnly are server-managed; all other
        properties are writable unless a derived schema states otherwise.'
      x-identifier-policy: UUID
      x-write-policy:
        readOnly:
        - id
        - created
        - createdBy
        - modified
        - modifiedBy
        writable: All properties not marked readOnly
      allOf:
      - type: object
        required:
        - id
        - name
        properties:
          id:
            type: string
            format: uuid
            readOnly: true
            description: Stable, server-assigned UUID for this DAF resource. It is immutable and is used in resource URLs.
          alias:
            type: string
            description: Optional alternate name for the resource. Writable by clients.
          author:
            type: string
            description: Person or organizational identity responsible for the model content. Author is a domain attribution and may differ from createdBy or modifiedBy. Writable by clients.
          created:
            type: string
            format: date-time
            readOnly: true
            description: Timestamp at which the resource was first persisted, expressed as an RFC 3339 date-time. Server-managed and readOnly.
          createdBy:
            type: string
            readOnly: true
            description: Authenticated principal that first persisted the resource. This audit identity is distinct from the domain author. Server-managed and readOnly.
          modified:
            type: string
            format: date-time
            readOnly: true
            description: Timestamp of the most recent persisted change, expressed as an RFC 3339 date-time. Server-managed and readOnly.
          modifiedBy:
            type: string
            readOnly: true
            description: Authenticated principal that most recently persisted a change. This audit identity is distinct from the domain author and createdBy. Server-managed and readOnly.
          status:
            type: string
            description: Lifecycle or workflow state of the resource. Writable by clients subject to domain workflow rules.
          version:
            type: string
            description: Domain or model version assigned to the resource. Writable by clients when the model version changes.
          name:
            type: string
            description: Human-readable name of the resource. Writable by clients.
          notes:
            type: string
            description: Free-form explanatory notes about the resource. Writable by clients.
          phase:
            type: string
            nullable: true
            description: Lifecycle or project phase associated with the model element.
          modelElementType:
            type: string
            nullable: true
            description: Base modeling type such as Class, Component, Actor or Requirement.
          stereotype:
            type: string
            nullable: true
            description: Qualified stereotype applied to the model element.
          visibility:
            type: string
            nullable: true
            enum:
            - public
            - private
            - protected
            - package
          packageId:
            type: string
            format: uuid
            nullable: true
            description: Identifier of the package containing the model element.
          parentId:
            type: string
            format: uuid
            nullable: true
            description: Identifier of the parent model element.
          pack:
            type: string
            description: Key of the industry pack that supplies the model element, for example tel. Empty for elements authored in the model itself. Writable by clients.
          inspiredBy:
            type: string
            description: The industry concept area a pack element is inspired by, for example process framework. It names an area, never an element of an industry standard. Empty for elements not supplied
              by a pack. Writable by clients.
    ActorTypes:
