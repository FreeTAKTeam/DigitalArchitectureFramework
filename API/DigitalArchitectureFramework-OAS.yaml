openapi: 3.0.1
info:
  title: DigitalArchitectureFramework
  version: 7.0.0 Beta 5
  description: The Digital Architecture Framework (DAF) is a metamodel and set of modeling tools for Digital Engineering. Its goal is to bridge the classic gaps between strategy, design, and execution by
    enabling collaboration between enterprise architects, solution architects, business analysts, and engineers. DAF provides standardised concepts and relationships (based on UML, ArchiMate, TOGAF, RUP,
    and SPEM) to create high-quality models (digital twins) that can be transformed into executable artifacts . This DAF OpenAPI makes those models accessible as services. It exposes the core DAF concepts—such
    as Business Processes, Value Streams, Goals, Initiatives, Capabilities, Applications, and Technology elements—as REST resources.
  contact:
    name: Giu Platania
    url: https://github.com/FreeTAKTeam/DigitalArchitectureFramework
    email: giu.platania@doorbusinessconsulting.com
  license:
    name: EPL
