    dCapability:
      description: Represents an organizational capability to achieve business outcomes.Can be current available in an Organization Unit (or) A business-focused outcome that is delivered by the completion
        of one or more work packages (by increasing the capability Maturity).
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          BusinessValue:
            allOf:
            - $ref: '#/components/schemas/CapabilityBusinessValue'
            description: 'How much value the capability brings to the enterprise: Low, Medium or High, or Support (needed but not distinctive) or Differentiator (sets you apart from competitors).'
            nullable: true
          Category:
            type: string
            description: A free categorisation of the capability, following your own taxonomy, e.g. "Customer management".
            nullable: true
          CostScope:
            allOf:
            - $ref: '#/components/schemas/dCostScope'
            description: 'Deprecated: dCapability.Cost is removed. A capability''s own cost periods (dCapabilityHasCostPeriod) hold only direct cost, and its full cost is derived from the cost periods of
              its linked roles and applications. Ignored by tools; do not set.'
            nullable: true
          Criticality:
            type: integer
            description: How critical the capability is, measured by the cost of it failing, on a scale of 1 (minor) to 100 (the business cannot operate).
            nullable: true
          HierarchyLevel:
            type: integer
            description: 'The level of this capability in the capability map: 1 for top-level capabilities, 2 for their children, and so on. It is not the maturity: use Increments for that.'
            nullable: true
          Increments:
            allOf:
            - $ref: '#/components/schemas/dIncrement'
            description: The current (as-is) maturity of the capability, from None (0) to Measured (5). Absent means not assessed, which is not the same as None.
            nullable: true
          IncrementsToBe:
            allOf:
            - $ref: '#/components/schemas/dIncrement'
            description: The maturity the capability should reach (to-be), from None (0) to Measured (5). Initiatives that raise it are linked by dInitiativeIncreasesMaturityOf. Absent means no target set.
            nullable: true
          IncrementSupplyChain:
            allOf:
            - $ref: '#/components/schemas/dIncrement'
            description: The maturity of this capability among your partners and suppliers, from None (0) to Measured (5). Absent means not assessed.
            nullable: true
          IncrementVertical:
            allOf:
            - $ref: '#/components/schemas/dIncrement'
            description: The typical maturity of this capability in your industry, from None (0) to Measured (5), for benchmarking. Absent means not assessed.
            nullable: true
          Owner:
            type: string
            description: The person or role accountable for the capability.
            nullable: true
          Risk:
            type: integer
            description: How much risk is attached to the capability, on a scale of 1 (low) to 100 (very high).
            nullable: true
          Source:
            type: string
            description: Where the information about this capability came from, e.g. a document, interview or tool export.
            nullable: true
          dBusinessAreaHasCapability_inverse:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dBusinessArea'
            description: is organized in Biz Area (has Capability). Ids of the dBusinessArea elements; multiplicity 1.
