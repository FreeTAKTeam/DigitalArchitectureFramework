    dRequirement:
      description: "A Business guide line about the Enterprise or the project. Requirements can be decomposed.\n A requirement is formulated in a SMART fashion and uses Moscow verbs (Must Have, Should Have,\
        \ Could Have, and Would Like to Have.).\n<ul>\n\t<li><b>Must Have</b>: These are the requirements that are considered essential for the success of the initiative and must be meet for the system\
        \ to function. They are often referred to as \"hard\" or \"mandatory\". requirements and are typically expressed in Boolean format as \"true\" or \"1\". </li>\n\t<li><b>Should Have</b>: These are\
        \ the requirements that are considered important, but not essential. They are typically expressed in Boolean format as \"maybe\" or \"0/1\" and are often used to prioritize the development of the\
        \ system.</li>\n\t<li></li>\n\t<li><b>Could Have</b>: These are the requirements that are considered desirable but not essential. They are typically expressed in Boolean format as \"false\" or \"\
        0\". They are used to identify potential enhancements to the system that can be added at a later date.</li>\n\t<li><b>Would Like to Have</b>: These are the requirements that are considered less\
        \ important and are often used to identify potential future enhancements to the system.</li>\n</ul>\nIn addition, the requirement should be SMART, which stands for Specific, Measurable, Achievable,\
        \ Relevant, and Time-bound. SMART requirements are clear, concise, and easy to understand, and they provide a clear way to measure the success of the project."
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          Author:
            type: string
            description: 'Who wrote the requirement: name and role in the project, e.g. "Ana Diaz, Analyst".'
            nullable: true
          Priority:
            type: integer
            description: The priority of the requirement as a percentage from 1 to 100. Requirements are ordered by it.
            nullable: true
          Proofreader:
            type: string
            description: 'Who confirmed the requirement: name and role in the project, e.g. "Tom Lee, Client". Every requirement needs one.'
            nullable: true
          Status:
            type: string
            description: Where the requirement is in the workflow, e.g. Proposed, Validated, Mandatory.
            nullable: true
          Type:
            allOf:
            - $ref: '#/components/schemas/dRequirementType'
            description: The kind of requirement, e.g. Business Rule, Security, Performance, Scalability.
            nullable: true
          dIssueStopsRealizationOfRequirement_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dIssue'
            description: is stopped by Issue (Issue Stops Realization Of Req). Ids of the dIssue elements; multiplicity 0..*.
          dRequirementContainsRequirement:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dRequirement'
            description: is contained by Requirement (Requirement Contains Req). Ids of the dRequirement elements; multiplicity 0..*.
          dRequirementContainsRequirement_inverse:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dRequirement'
            description: Contains Requirement (Requirement Contains Req). Ids of the dRequirement elements; multiplicity 0..1.
            nullable: true
          dRequirementIsRelatedToGoal:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dGoal'
            description: specifies Goal (req related to Goal). Ids of the dGoal elements; multiplicity 0..*.
          dRequirementIsSatisfiedByFeature_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dFeature'
            description: is realized by Feature (is Satisfied By). Ids of the dFeature elements; multiplicity 0..*.
    dResource:
      description: a type of Asset supporting a Business capability
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          '# of items':
            type: number
            description: How many units of the resource are available, e.g. 40 for 40 vehicles.
            nullable: true
          depreciationMethod:
            allOf:
            - $ref: '#/components/schemas/dDepreciationMethod'
            description: 'How its Capex is spread over usefulLife: StraightLine or DecliningBalance. The depreciation schedule is derived from the Capex cost periods, inServiceDate, usefulLife and this
              method; it is not stored.'
            nullable: true
          inServiceDate:
            type: string
            format: date
            description: The date the asset went into use; depreciation starts here. Absent means not recorded.
            nullable: true
          usefulLife:
            type: string
            format: duration
            description: How long the asset is depreciated over, as an xsd:duration, e.g. P5Y. Absent means the asset is not capitalised or the life is not recorded.
            nullable: true
          dResourceHasCostPeriod:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dCostPeriod'
            description: 'has Cost Period (Resource Has Cost Period). Ids of the dCostPeriod elements; multiplicity 0..*. The cost of the resource in one period: its purchase (Capex) or its upkeep, e.g.
              maintenance of an owned fleet (Opex).'
          dResourceimpactedByRisk_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dRisk'
            description: is impacted by Risk (Resource impacted by Risk). Ids of the dRisk elements; multiplicity 0..*.
          dResourceSupportsCapability:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dCapability'
            description: Supports Capability (Resource supports Capability). Ids of the dCapability elements; multiplicity 1..*.
        required:
        - dResourceSupportsCapability
    dRevenuePeriod:
      description: Revenue earned by one product or contract in one period, reported (kind Actual) or planned (kind Estimate). It can be included in the financial period of the organisation unit whose books
        it lands in (dFinancialPeriodIncludesRevenuePeriod).
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          amount:
            allOf:
            - $ref: '#/components/schemas/dQuantityValue'
            description: The revenue earned in the period, with an ISO 4217 currency as unit. Use kind Actual for reported revenue and Estimate for a plan.
          periodLength:
            type: string
            format: duration
            description: The length of the period, as an xsd:duration, e.g. P1M, P1Y. The revenue periods of one product or contract must not overlap.
          periodStart:
            type: string
            format: date
            description: The first day of the period.
          dContractHasRevenuePeriod_inverse:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dContract'
            description: is revenue of Contract (Contract Has Revenue Period). Ids of the dContract elements; multiplicity 0..1.
            nullable: true
          dFinancialPeriodIncludesRevenuePeriod_inverse:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dFinancialPeriod'
            description: is included in Financial Period (Financial Period Includes Revenue Period). Ids of the dFinancialPeriod elements; multiplicity 0..1.
            nullable: true
          dProductHasRevenuePeriod_inverse:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dProduct'
            description: is revenue of Product (Product Has Revenue Period). Ids of the dProduct elements; multiplicity 0..1.
            nullable: true
        required:
        - amount
        - periodLength
        - periodStart
    dRisk:
      description: a risk Identifies and assesses potential issue impacting other elements. It is a potential future Issue. Can be hierarchically decomposed.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          likelihood:
            type: integer
            description: The probability that the risk becomes an issue, on a scale of 1 (very unlikely) to 100 (almost certain). Absent means not assessed.
            nullable: true
          RiskStrategy:
            allOf:
            - $ref: '#/components/schemas/dRiskStrategy'
            description: 'How the risk is handled: Terminate (remove the cause), Treat (reduce it), Tolerate (accept it) or Transfer (e.g. insure or outsource it).'
            nullable: true
          Severity:
            type: integer
            description: The impact if the risk happens, on a scale of 1 (negligible) to 100 (critical). Absent means not assessed.
            nullable: true
          dApplicationRisk:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dApplicationComponent'
            description: is related to Application (Application Risk). Ids of the dApplicationComponent elements; multiplicity 0..*.
          dResourceimpactedByRisk:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dResource'
            description: impact Resouce (Resource impacted by Risk). Ids of the dResource elements; multiplicity 0..*.
          dRiskIsRelatedToRisk:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dRisk'
            description: target Risk (Risk is related to Risk). Ids of the dRisk elements; multiplicity 0..*.
          dRiskIsRelatedToRisk_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dRisk'
            description: Source Risk (Risk is related to Risk). Ids of the dRisk elements; multiplicity 0..*.
          dRiskRealizedByIssue_inverse:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dIssue'
            description: is realized by Issue (realized by Issue). Ids of the dIssue elements; multiplicity 0..1.
            nullable: true
    dRole:
      description: The usual or expected function of an actor, or the part somebody or something plays in a particular action or event. An actor may have a number of roles.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          CostRate:
            allOf:
            - $ref: '#/components/schemas/dQuantityValue'
            description: 'The cost of one unit of the role''s capacity, e.g. 85000 CAD per P1Y with basis "per FTE". It is a rate, not spend: the spend on the role goes into its cost periods (dRoleHasCostPeriod).
              Absent means not known.'
            nullable: true
          DegreeOfUtilisation:
            allOf:
            - $ref: '#/components/schemas/dQuantityValue'
            description: The share of the role's capacity that is in use, with unit %, e.g. 88 %. Absent means not measured.
            nullable: true
          FTEs:
            allOf:
            - $ref: '#/components/schemas/dQuantityValue'
            description: The number of full-time equivalents working in the role, with unit {FTE}, e.g. 42 {FTE}. Absent means not counted.
            nullable: true
          isSkillsAvailable:
            type: boolean
            description: true when the people in the role have the skills it needs; otherwise false.
            nullable: true
          isSkillsDefined:
            type: boolean
            description: true when the skills the role needs are written down; otherwise false.
            nullable: true
          Owner:
            type: string
            description: The person or unit accountable for the role, e.g. its line manager.
            nullable: true
          Source:
            type: string
            description: Where the information about this role came from, e.g. the HR system.
            nullable: true
          User:
            type: string
            description: A free categorisation of the role, following your own taxonomy.
            nullable: true
          dRoleConsumesService:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dBusinessService'
            description: Consumes Service (Role Consumes Service). Ids of the dBusinessService elements; multiplicity 0..*. The role uses the service's output; it does not do the service's work. Use dRoleStaffsService
              for the roles whose capacity delivers the service.
          dRoleExecutesCapability_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dCapability'
            description: executes Capability (role Executes Capability). Ids of the dCapability elements; multiplicity 0..*.
          dRoleHasCostPeriod:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dCostPeriod'
            description: has Cost Period (Role Has Cost Period). Ids of the dCostPeriod elements; multiplicity 0..*. The spend on the role in one period, e.g. salaries of its FTEs. The rate per FTE is CostRate.
          dRoleHasSkill:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dSkill'
            description: has SKill (Role has skill). Ids of the dSkill elements; multiplicity 0..*.
          dRoleisAssociatedToOrganization:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dOrganizationUnit'
            description: works in Organization (Role is Associated To Organization). Ids of the dOrganizationUnit elements; multiplicity 0..1.
            nullable: true
          dRoleIsPerformedByActor_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dActor'
            description: is executed by Actor (Role isPerformed By Actor). Ids of the dActor elements; multiplicity 0..*.
          dRoleMaintainsApplication:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dApplicationComponent'
            description: maintains Application (Role Maintains Application). Ids of the dApplicationComponent elements; multiplicity 0..*.
          dRoleStaffsService:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dBusinessService'
            description: 'staffs Service (Role Staffs Service). Ids of the dBusinessService elements; multiplicity 0..*. The role''s capacity delivers the service: it does the service''s work.'
    dSecurityGroup:
      description: Controls and manages access and permissions between services, in line with TOGAF's Security Architecture for protecting digital assets.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          dNetworkHasSecurityGroup_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dNetwork'
            description: is associated to Network (Network Has Security Group). Ids of the dNetwork elements; multiplicity 0..*.
          dSecurityGroupHasPhysicalService:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dPhysicalService'
            description: has Physical Service (Security Group Has Service). Ids of the dPhysicalService elements; multiplicity 0..*.
    dSkill:
      description: an ability that some role possesses with various degree
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          SkillCategory:
            type: string
            description: The group the skill belongs to, e.g. "Technical", "Domain", "Leadership".
            nullable: true
          SkillLevel:
            type: string
            description: How well the skill is mastered, on your own scale, e.g. Basic, Proficient, Expert.
            nullable: true
          dRoleHasSkill_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dRole'
            description: known by Role (Role has skill). Ids of the dRole elements; multiplicity 0..*.
    dStakeholder:
      description: Represents any party or force influencing the domain of interest. Any person or force that have an interest in the considered domain. This is typically indicated by name, can be connected
        with a Role in the organization. A stakeholder has open and Inner opinions that are relevant for the subject matter.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          Attitude:
            allOf:
            - $ref: '#/components/schemas/NetworkQuality'
            description: 'How favourable the stakeholder is to the change: Low (opposed), Medium (neutral) or High (supportive).'
            nullable: true
          Knowledge:
            allOf:
            - $ref: '#/components/schemas/NetworkQuality'
            description: 'How much the stakeholder knows about the subject: Low, Medium or High.'
            nullable: true
          Legitimacy:
            allOf:
            - $ref: '#/components/schemas/NetworkQuality'
            description: 'How widely the stakeholder''s claim is accepted as appropriate by others: Low, Medium or High.'
            nullable: true
          Power:
            allOf:
            - $ref: '#/components/schemas/NetworkQuality'
            description: 'How far the stakeholder can impose their will on the outcome: Low, Medium or High.'
            nullable: true
          RACI:
            type: string
            description: 'The stakeholder''s responsibility: R (Responsible: does the work), A (Accountable: answers for the result; only one per task), C (Consulted: gives input before the work is done)
              or I (Informed: is told the outcome).'
            nullable: true
          role:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dRole'
            description: The role the stakeholder plays in the organisation, when it is in the model.
            nullable: true
          Urgency:
            allOf:
            - $ref: '#/components/schemas/NetworkQuality'
            description: 'How much the stakeholder''s concerns call for immediate attention: Low, Medium or High.'
            nullable: true
          dApplicationHasOwner_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dApplicationComponent'
            description: has Owner (Application has Owner). Ids of the dApplicationComponent elements; multiplicity 0..*.
          dOrgUnitHasStakeholders_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dOrganizationUnit'
            description: is concerned with Organization (Org Unit has Stakeholders). Ids of the dOrganizationUnit elements; multiplicity 0..*.
          dStakeholderHasInnerOpinion:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dOpinionInner'
            description: Has Inner Opinion (Stakeholder Has Inner Opinion). Ids of the dOpinionInner elements; multiplicity 0..*.
          dStakeholderHasOpinion:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dOpinion'
            description: Has Opinion (Stakeholder Has Opinion). Ids of the dOpinion elements; multiplicity 0..*.
    dSubNetwork:
      description: A subset of a network, used to organize and isolate portions of the network. Equivalent to an ArchiMate Node, responsible for networking resources.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          dNetworkAggregatesSubNetwork_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dNetwork'
            description: is Aggregated in Network (Network Aggregates SubNetwork). Ids of the dNetwork elements; multiplicity 0..*.
          dSubNetworkAggregatesIPRange:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dIPRange'
            description: Aggregates IP Range (SubNetwork Aggregates IP Range). Ids of the dIPRange elements; multiplicity 0..*.
    dSystem:
      description: 'A system configuration. Settings are modeled as attributes with default values, each attribute of the System Config becomes a line in the configuration file.

        e.g. SystemConfig .path = c:/users/app'
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          config:
            type: string
            description: The configuration file the settings are written to, e.g. config.ini.
          platform:
            type: string
            description: The platform the settings apply to, e.g. "production", "Windows".
            nullable: true
          dApplicationconfiguredbySystemConfiguration_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dApplicationComponent'
            description: configures Application (Application configured by System Configuration). Ids of the dApplicationComponent elements; multiplicity 0..*.
        required:
        - config
    dTable:
      description: Represents physical tables in a database schema.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          Database:
            type: string
            description: The database schema that holds the table, e.g. claims.
            nullable: true
          dTableProvidesPersistenceForModelClass_inverse:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dModelClass'
            description: Provides Persistence For Model (Table Provides Persistence to Model). Ids of the dModelClass elements; multiplicity 1.
        required:
        - dTableProvidesPersistenceForModelClass_inverse
    dTest:
      description: Represents a mechanism for verifying or validating the functionality, behavior, or compliance of am application component . Tests can include automated or manual procedures designed to
        ensure alignment with requirements, detect defects, and confirm expected outcomes.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          dTest_ApplicationComponent:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dApplicationComponent'
            description: Test validates Component (Test validates Component). Ids of the dApplicationComponent elements; multiplicity 0..*.
    dUserStory:
      description: Captures user-centric requirements expressed as stories.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          EstimatedEffort:
            type: string
            description: The estimated effort to deliver the story, in hours, e.g. 8.
            nullable: true
          StoryDetails:
            type: string
            format: uuid
            x-reference: '#/components/schemas/SupportingClass_Story'
            description: 'The story itself: "As a <role> I want <scope> so that <value>".'
          TestScenario:
            type: string
            description: 'How to check that the story is done: the situation and the expected result, e.g. "Given ... when ... then ...".'
            nullable: true
          dUseCaseHasStory:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dBusinessUseCase'
            description: Is associated to Use Case (Use Case Has Story). Ids of the dBusinessUseCase elements; multiplicity 0..*.
        required:
        - StoryDetails
    dValue:
      description: An attribute of a Node value type used in DAF. These values are persistent
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          app_data_type:
            type: string
            description: 'How the value is handled by the application: DATATYPE_ATTRIBUTE, DATATYPE_ELEMENT, DATATYPE_DONTCARE or DATATYPE_IGNORE.'
            nullable: true
          column_name:
            type: string
            description: The name of the database column. Empty means the value's name is used.
            nullable: true
          db_data_type:
            type: string
            description: The column type in the database, e.g. VARCHAR(255), INT, DATE.
            nullable: true
          display_type:
            type: string
            description: How the value is shown, e.g. text, image.
            nullable: true
          input_type:
            type: string
            description: The HTML input control used to edit the value, e.g. text, or select#fix:key1[val1]|key2[val2] for a fixed list.
            nullable: true
          is_editable:
            type: boolean
            description: true when users can change the value; otherwise false.
            nullable: true
          restrictions_description:
            type: string
            description: The message shown to users when the value breaks a restriction, e.g. "Enter a date as DD.MM.YYYY".
            nullable: true
          restrictions_match:
            type: string
            description: A regular expression the value must match, e.g. [0-3][0-9]\.[0-1][0-9]\.[0-9]{4} for a date.
            nullable: true
          restrictions_not_match:
            type: string
            description: A regular expression the value must not match.
            nullable: true
    dValueRef:
      description: A Node value type used in DAF that reference another Node Value, similar to a foreign Key. These values are persistent
      allOf:
      - $ref: '#/components/schemas/dValue'
      - type: object
        properties:
          reference_value:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dValue'
            description: The dValue this reference points to, like a foreign key.
        required:
        - reference_value
    dValueStream:
      description: "A representation of  an end-to end collection  of value-adding  Business Processes that create an overall result for a customer, stakeholder or end user. \nA sequence of activities an\
        \ enterprise undertakes to deliver on a customer request. More broadly, the sequence of activities required to design, produce, and deliver a good or service to a customer, and it includes the dual\
        \ flows of information and material."
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          Criticality:
            allOf:
            - $ref: '#/components/schemas/ValueStreamCriticality'
            description: How much the value stream matters to the customer and the business, from Negligible Impact to Significant Impact. Leave Not Analyzed until it is assessed.
            nullable: true
          entrance criteria:
            type: string
            description: What starts the value stream, e.g. "customer requests a quote".
            nullable: true
          exit criteria:
            type: string
            description: What ends the value stream, i.e. the value delivered, e.g. "policy issued and paid".
            nullable: true
          is Decomposed:
            type: boolean
            description: true when the value stream has been broken down into stages; otherwise false.
            nullable: true
          dValueStreamEnablesCapability:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dCapability'
            description: Enables Capability (Value Stream Enables Capability). Ids of the dCapability elements; multiplicity 0..*.
          dValueStreamIncludesProcesses:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dBusinessProcess'
            description: Includes Process (Value Stream Includes Processes). Ids of the dBusinessProcess elements; multiplicity 0..*.
    dView:
      description: A View used in DAF. Controller, Views and Associations define the application flow
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          dControllerGovernsView_inverse:
            type: string
            format: uuid
            x-reference: '#/components/schemas/dController'
            description: is Governed by Controller (Governs View). Ids of the dController elements; multiplicity 0..1.
            nullable: true
          dObjectInstanceofView_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dObject'
            description: Istance of View (Instance of View). Ids of the dObject elements; multiplicity 0..*.
    dVolume:
      description: Refers to the storage assigned to containers, ensuring persistence, aligning with the Data Object in ArchiMate’s Application Layer.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          MountPath:
            type: string
            description: The path inside the container where the volume is mounted, e.g. /var/lib/postgresql/data.
          name:
            type: string
            description: The name of the volume, e.g. claims-data.
            nullable: true
          subPath:
            type: string
            description: A sub-directory of the volume to mount instead of its root. Empty means the whole volume.
            nullable: true
          dContainerAggregatesVolume_inverse:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dContainer'
            description: is Aggregated in Container (Container Aggregates Volume). Ids of the dContainer elements; multiplicity 0..*.
        required:
        - MountPath
    dZone:
      description: Defines macro divisions containing regions mapped to ArchiMate’s Infrastructure Service.
      allOf:
      - $ref: '#/components/schemas/DAFBase'
      - type: object
        properties:
          dZoneAggregatesRegion:
            type: array
            items:
              type: string
              format: uuid
              x-reference: '#/components/schemas/dRegion'
            description: Aggregates Region (Zone Aggregates Region). Ids of the dRegion elements; multiplicity 0..*.
  parameters:
    id:
      name: id
      required: true
      description: Stable UUID of the DAF resource addressed by this operation.
      schema:
        type: string
        format: uuid
      in: path
  responses:
    200dAPI_post:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dAPI'
    200dAPI_delete:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dAPI'
    200dAPI_get:
      description: Success
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/dAPI'
    200dAPI_patch:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dAPI'
    200dAPI_get_one:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dAPI'
    200dAPIOperation_post:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dAPIOperation'
